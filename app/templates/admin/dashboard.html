<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- Mobile Header -->
<header class="mobile-header">
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <h2>后台管理</h2>
</header>

<div class="app-layout">
    
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>WWords</h2>
        </div>
        
        <div class="user-info">
            管理员模式
        </div>

        <nav class="nav-links">
            <a href="/dashboard" class="nav-btn">
                🔙 返回工作台
            </a>
            <button class="nav-btn active">
                ⚙️ 系统配置
            </button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        
        <div id="ai-config" class="panel">
            <h2>AI 配置</h2>
            <form id="ai-config-form">
                <label>Provider
                    <select name="provider">
                        <option value="openai">OpenAI</option>
                        <option value="gemini">Gemini</option>
                    </select>
                </label>
                <label>API Key
                    <input name="api_key" type="password">
                </label>
                <label>API URL
                    <input name="api_url" placeholder="https://api.openai.com/v1">
                </label>
                <label>Model
                    <input name="model" value="gpt-4o-mini">
                </label>
                <label>Temperature
                    <input name="temperature" type="number" min="0" max="2" step="1" value="0">
                </label>
                <button class="btn" type="submit">保存配置</button>
            </form>
        </div>

        <div id="user-management" class="panel">
            <div class="panel-head">
                <div>
                    <h2>用户管理</h2>
                    <p class="panel-meta" id="users-summary">加载中...</p>
                </div>
            </div>

            <form id="user-search-form" class="grid compact-grid">
                <label>搜索邮箱
                    <input name="query" placeholder="admin@example.com">
                </label>
                <div class="actions align-end">
                    <button class="btn ghost" type="submit">搜索</button>
                    <button class="btn ghost" type="button" id="clear-search-btn">清空</button>
                </div>
            </form>

            <div class="glass-divider"></div>

            <h3>创建用户</h3>
            <form id="create-user-form" class="grid compact-grid">
                <label>邮箱
                    <input name="email" type="email" required placeholder="user@example.com">
                </label>
                <label>初始密码
                    <input name="password" type="text" required placeholder="StrongPassword123!">
                </label>
                <label>语言
                    <select name="preferred_language">
                        <option value="en">English</option>
                        <option value="zh">中文</option>
                    </select>
                </label>
                <label>主题
                    <select name="preferred_theme">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </label>
                <label class="checkbox-row">
                    <input name="is_admin" type="checkbox">
                    <span>授予管理员权限</span>
                </label>
                <div class="actions align-end">
                    <button class="btn" type="submit">创建用户</button>
                </div>
            </form>

            <div class="table-responsive">
                <table id="users-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Email</th>
                            <th>语言</th>
                            <th>主题</th>
                            <th>Admin</th>
                            <th>重置密码</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<script src="/static/admin.js"></script>
<script>
    // Mobile Sidebar Logic (Replicated for Admin Page)
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    if(menuToggle) {
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        });
    }

    if(overlay) {
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });
    }
</script>
</body>
</html>
